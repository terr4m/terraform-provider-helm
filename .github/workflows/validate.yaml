name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup rumdl
        uses: action-stars/install-tool-from-github-release@1fa61c3bea52eca3bcdb1f5c961a3b113fe7fa54 # v0.2.6
        with:
          github_token: ${{ github.token }}
          owner: rvben
          repository: rumdl
          filename_format: "{name}-v{version}-{arch}-{os}.{ext}"
          arch_amd64: x86_64
          os_linux: unknown-linux-gnu
          check_command: rumdl --version
          version: latest

      - name: Lint markdown
        run: rumdl check --output-format github .

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go mod download
        run: go mod download

      - name: Run linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          args: --timeout=10m

      - name: Build
        run: |
          set -euo pipefail

          mkdir -p ./dist
          go build -o ./dist -v .

  generate:
    name: Generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Generate
        working-directory: ./tools
        run: |
          set -euo pipefail

          go mod download
          go generate ./...

      - name: Check diff
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."
            exit 1
          fi

  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      tf_versions: ${{ steps.setup.outputs.tf_versions }}
      k8s_versions: ${{ steps.setup.outputs.k8s_versions }}
    steps:
      - name: Setup
        id: setup
        run: |
          set -euo pipefail

          tf_versions="$(curl --fail --silent --location --retry 3 https://endoflife.date/api/terraform.json | jq --raw-output --compact-output '[sort_by(.releaseDate) | reverse | .[0:4] | .[].latest]')"
          k8s_versions="$(curl --fail --silent --location --retry 3 https://endoflife.date/api/kubernetes.json | jq --raw-output --compact-output '[sort_by(.releaseDate) | reverse | .[0:4] | .[].latest]')"

          {
            echo "tf_versions=${tf_versions}"
            echo "k8s_versions=${k8s_versions}"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs:
      - build
      - generate
      - matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        tf_version: ${{ fromJson(needs.matrix.outputs.tf_versions) }}
        k8s_version: ${{ fromJson(needs.matrix.outputs.k8s_versions) }}
    env:
      KUBE_CONFIG_PATH: ${{ github.workspace }}/.kube/config
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Setup
        id: setup
        run: |
          set -euo pipefail

          k8s_version="${{ matrix.k8s_version }}"
          k8s_major="$(echo "${k8s_version}" | cut -d. -f1)"
          k8s_minor="$(echo "${k8s_version}" | cut -d. -f2)"

          regex="^v${k8s_major}\.${k8s_minor}\.[0-9]+$"
          kind_node_tag="v$(crane ls --omit-digest-tags docker.io/kindest/node | grep -E "${regex}" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | jq -sRr '[split("\n") | .[] | select(. != "")] | sort_by(. | split(".") | map(tonumber)) | .[-1]')"

          echo "kind_node_tag=${kind_node_tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ matrix.tf_version }}
          terraform_wrapper: false

      - name: Terraform Lookup
        id: tf
        run: |
          set -euo pipefail

          {
            echo "version=$(terraform version -json | jq --raw-output '.terraform_version')"
            echo "path=$(command -v terraform || true)"
          } >> "${GITHUB_OUTPUT}"

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          kubeconfig: ${{ env.KUBE_CONFIG_PATH }}
          node_image: kindest/node:${{ steps.setup.outputs.kind_node_tag }}
          wait: 2m

      - name: Go mod download
        run: go mod download

      - name: Test
        env:
          TF_ACC: "1"
          TF_ACC_PROVIDER_NAMESPACE: terr4m
          TF_ACC_TERRAFORM_VERSION: ${{ steps.tf.outputs.version }}
          TF_ACC_TERRAFORM_PATH: ${{ steps.tf.outputs.path }}
        run: go test -v -timeout 120m -cover ./...

  check:
    name: Check
    needs:
      - build
      - generate
      - test
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check
        run: |
          set -euo pipefail
          results=( ${{ join(needs.*.result, ' ') }} )
          for result in "${results[@]}"; do
            if [[ "${result}" == "failure" ]] || [[ "${result}" == "cancelled" ]]; then
              echo "::error::Workflow failed!"
              exit 1
            fi
          done
